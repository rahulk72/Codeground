<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Arena | CodeGround</title>
<style>
:root{--bg:#080d18;--card:#101827;--bd:#26364b;--tx:#edf4ff;--mu:#94a3b8;--ac:#22d3ee;--on:#06111f}
[data-theme=light]{--bg:#f4f7fb;--card:#fff;--bd:#d3dce8;--tx:#0f172a;--mu:#475569;--ac:#0e7490;--on:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.nav{display:flex;gap:.3rem;align-items:center;padding:.7rem 1.2rem;border-bottom:1px solid var(--bd);overflow-x:auto}
.nav a{padding:.4rem .8rem;border-radius:.6rem;color:var(--mu);white-space:nowrap;font-size:.9rem}
.nav a:hover,.nav a.on{background:var(--card);color:var(--tx)}
.wrap{max-width:56rem;margin:0 auto;padding:2rem 1.2rem}
h1{margin:0 0 .5rem;font-size:1.8rem}
.card{display:block;width:100%;text-align:left;border:1px solid var(--bd);border-radius:1rem;background:var(--card);padding:.9rem 1.2rem;margin-top:.6rem}
button.card:hover{border-color:var(--ac)}
.gh{border:1px solid var(--bd);border-radius:.7rem;padding:.45rem .9rem;background:none}
.gh.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn{border:0;border-radius:.7rem;padding:.55rem 1.1rem;background:var(--ac);color:var(--on);font-weight:700}
.mu{color:var(--mu)}
.lv{font-size:.72rem;font-weight:700;padding:.15rem .6rem;border-radius:99px;border:1px solid currentColor}
.Easy{color:#22c55e}.Medium{color:#f59e0b}.Hard{color:#ef4444}
.fl{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}
pre{margin:.6rem 0;padding:.9rem;border:1px solid var(--bd);border-radius:.7rem;background:var(--card);overflow-x:auto;font-size:.85rem;white-space:pre-wrap}
textarea{display:block;width:100%;margin:.4rem 0 1rem;padding:.8rem;border:1px solid var(--bd);border-radius:.8rem;background:var(--card);color:var(--tx);font:14px/1.5 Consolas,monospace;resize:vertical}
#code{height:18rem;tab-size:2}
.res{min-height:4rem}
</style>
</head>
<body>
<div class="nav"><a href="index.html"><b>Rise &amp; Grow</b></a><a href="learn.html">Learn Java</a><a href="practice.html" class="on">Coding Arena</a><a href="quiz.html">Quiz Zone</a><a href="dashboard.html">My Progress</a></div>
<main class="wrap" id="app"></main>

<script>
try{document.documentElement.dataset.theme=JSON.parse(localStorage.cgSettings||"{}").theme||"dark"}catch(e){}

const TPL = body => "import java.util.*;\n\npublic class Main {\n  public static void main(String[] args) {\n    Scanner sc = new Scanner(System.in);\n" + body + "\n  }\n}";
const ind = b => b.split("\n").map(l => "    " + l).join("\n");

// [title, level, statement, hint, solution body, tests [[input, expected output], ...]]
const P = [
["Even or Odd","Easy","Read an integer n and print Even or Odd.\nInput: n\nOutput: Even or Odd","Use the remainder operator %.",
"int n=sc.nextInt();\nSystem.out.println(n%2==0?\"Even\":\"Odd\");",[["7","Odd"],["10","Even"],["0","Even"]]],
["Sum of Digits","Easy","Print the sum of the digits of n.\nInput: n (positive)\nOutput: the sum","n % 10 is the last digit, n / 10 removes it.",
"int n=sc.nextInt(),s=0;\nwhile(n>0){s+=n%10;n/=10;}\nSystem.out.println(s);",[["1234","10"],["9","9"],["1005","6"]]],
["Factorial","Easy","Print n! (n is from 0 to 20).\nInput: n\nOutput: n!","Multiply from 2 to n. Use long.",
"int n=sc.nextInt();long f=1;\nfor(int i=2;i<=n;i++)f*=i;\nSystem.out.println(f);",[["5","120"],["0","1"],["20","2432902008176640000"]]],
["Reverse a Number","Easy","Print n with its digits reversed.\nInput: n (positive)\nOutput: reversed number (1200 gives 21)","Build r = r * 10 + last digit.",
"int n=sc.nextInt(),r=0;\nwhile(n>0){r=r*10+n%10;n/=10;}\nSystem.out.println(r);",[["1234","4321"],["1200","21"],["7","7"]]],
["Fibonacci Series","Easy","Print the first n Fibonacci numbers separated by spaces.\nInput: n\nOutput: for n=6, 0 1 1 2 3 5","Keep two variables a and b and update them each step.",
"int n=sc.nextInt(),a=0,b=1;\nStringBuilder sb=new StringBuilder();\nfor(int i=0;i<n;i++){sb.append(a).append(i<n-1?\" \":\"\");int c=a+b;a=b;b=c;}\nSystem.out.println(sb);",[["6","0 1 1 2 3 5"],["1","0"],["2","0 1"]]],
["Palindrome String","Easy","Check if a word reads the same backwards.\nInput: one word\nOutput: Palindrome or Not palindrome","Compare the string with its reverse.",
"String s=sc.next();\nboolean ok=s.equals(new StringBuilder(s).reverse().toString());\nSystem.out.println(ok?\"Palindrome\":\"Not palindrome\");",[["madam","Palindrome"],["hello","Not palindrome"],["a","Palindrome"]]],
["Prime Check","Medium","Check if n is prime.\nInput: n\nOutput: Prime or Not prime","Test divisors only up to the square root of n. 1 is not prime.",
"int n=sc.nextInt();boolean p=n>1;\nfor(int i=2;(long)i*i<=n;i++)if(n%i==0){p=false;break;}\nSystem.out.println(p?\"Prime\":\"Not prime\");",[["29","Prime"],["1","Not prime"],["100","Not prime"],["2","Prime"]]],
["Largest in Array","Medium","Print the largest number.\nInput: first line n, second line n integers\nOutput: the largest","Start with the first element and update when you find a bigger one.",
"int n=sc.nextInt(),m=sc.nextInt();\nfor(int i=1;i<n;i++){int x=sc.nextInt();if(x>m)m=x;}\nSystem.out.println(m);",[["3\n3 9 2","9"],["4\n-5 -2 -9 -7","-2"],["1\n5","5"]]],
["Count Vowels","Medium","Count the vowels (a, e, i, o, u, any case) in a word.\nInput: one word\nOutput: the count","Convert to lowercase and test each character with indexOf.",
"String s=sc.nextLine().toLowerCase();int c=0;\nfor(char ch:s.toCharArray())if(\"aeiou\".indexOf(ch)>=0)c++;\nSystem.out.println(c);",[["Education","5"],["rhythm","0"],["AEIOU","5"]]],
["Second Largest","Medium","Print the second largest distinct number.\nInput: first line n, second line n integers\nOutput: the second largest distinct value","Track the largest and second largest in one pass, without sorting.",
"int n=sc.nextInt(),f=Integer.MIN_VALUE,s=Integer.MIN_VALUE;\nfor(int i=0;i<n;i++){int x=sc.nextInt();\n  if(x>f){s=f;f=x;}else if(x>s&&x!=f)s=x;}\nSystem.out.println(s);",[["3\n4 9 7","7"],["5\n10 10 8 8 5","8"],["4\n1 2 3 4","3"]]],
["Anagram Check","Hard","Check if two words are anagrams.\nInput: two words on two lines\nOutput: Anagram or Not anagram","Sort the characters of both words and compare them.",
"char[] x=sc.next().toCharArray(),y=sc.next().toCharArray();\nArrays.sort(x);Arrays.sort(y);\nSystem.out.println(Arrays.equals(x,y)?\"Anagram\":\"Not anagram\");",[["listen\nsilent","Anagram"],["abc\nabd","Not anagram"],["a\na","Anagram"]]],
["Binary Search","Hard","Find the index of key in a sorted array, or -1.\nInput: line 1 n, line 2 n sorted integers, line 3 key\nOutput: index (starting at 0) or -1","Halve the search range each step using lo, hi and mid.",
"int n=sc.nextInt();int[] a=new int[n];\nfor(int i=0;i<n;i++)a[i]=sc.nextInt();\nint k=sc.nextInt(),lo=0,hi=n-1,idx=-1;\nwhile(lo<=hi){int m=(lo+hi)/2;\n  if(a[m]==k){idx=m;break;}else if(a[m]<k)lo=m+1;else hi=m-1;}\nSystem.out.println(idx);",[["5\n1 3 5 7 9\n7","3"],["5\n1 3 5 7 9\n4","-1"],["1\n2\n2","0"]]]
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm = s => s.replace(/\r/g,"").split("\n").map(l => l.trimEnd()).join("\n").trim();
let A = {}; try { A = JSON.parse(localStorage.getItem("cgArena") || "{}"); } catch (e) {}
let flt = "All", cur = -1, sh = {h: 0, s: 0};

function list() {
  cur = -1;
  $("app").innerHTML = '<h1>Coding Arena</h1><p class="mu">Write real Java, run it, and submit against test cases. Solved: ' + Object.keys(A).length + ' / ' + P.length + '</p>' +
    '<div class="fl">' + ["All","Easy","Medium","Hard"].map(l => '<button class="gh' + (l === flt ? " on" : "") + '" data-f="' + l + '">' + l + '</button>').join("") + '</div>' +
    P.map((p, i) => flt !== "All" && p[1] !== flt ? "" :
      '<button class="card" data-o="' + i + '"><b>' + (i + 1) + '. ' + p[0] + '</b> <span class="lv ' + p[1] + '">' + p[1] + '</span>' + (A[i] ? ' <span style="color:#22c55e">✓ Solved</span>' : "") + '</button>').join("");
}

function open(i) {
  cur = i; sh = {h: 0, s: 0};
  const p = P[i]; let code = null;
  try { code = localStorage.getItem("cgCode" + i); } catch (e) {}
  if (!code) code = TPL("    // write your code here");
  $("app").innerHTML = '<button class="gh" data-b>← All problems</button>' +
    '<h1 style="margin-top:1rem">' + (i + 1) + '. ' + p[0] + ' <span class="lv ' + p[1] + '">' + p[1] + '</span></h1><pre>' + esc(p[2]) + '</pre>' +
    '<label class="mu">Your Java code</label><textarea id="code" spellcheck="false">' + esc(code) + '</textarea>' +
    '<label class="mu">Custom input (used by Run)</label><textarea id="inp" spellcheck="false" style="height:5rem">' + esc(p[5][0][0]) + '</textarea>' +
    '<div class="row"><button class="btn" data-run>▶ Run</button><button class="btn" data-sub>Submit</button><button class="gh" data-reset>Reset code</button><button class="gh" data-h>Hint</button><button class="gh" data-s>Solution</button></div>' +
    '<pre id="res" class="res mu">Output will appear here.</pre><div id="extra"></div>';
}

async function run(code, input) {
  try {
    return await (await fetch("/api/run", {method: "POST", body: new URLSearchParams({code: code, input: input})})).json();
  } catch (e) { return {ok: false, out: "Cannot reach the server. Open this page from http://localhost:8080"}; }
}

async function doRun() {
  $("res").textContent = "Running...";
  const r = await run($("code").value, $("inp").value);
  $("res").textContent = (r.ok ? "" : "✗ ") + (r.out || "(no output)");
}

async function doSub() {
  const p = P[cur], code = $("code").value; let pass = 0, txt = "";
  $("res").textContent = "Running tests...";
  for (let t = 0; t < p[5].length; t++) {
    const r = await run(code, p[5][t][0]);
    if (!r.ok) { $("res").textContent = "✗ " + r.out; return; }
    const ok = norm(r.out) === norm(p[5][t][1]);
    if (ok) pass++;
    txt += "Test " + (t + 1) + ": " + (ok ? "✓ Passed" : "✗ Failed\n   Input:    " + p[5][t][0].replace(/\n/g, " | ") + "\n   Expected: " + p[5][t][1] + "\n   Got:      " + r.out.trim()) + "\n";
  }
  txt = "Passed " + pass + " / " + p[5].length + "\n\n" + txt;
  if (pass === p[5].length) {
    A[cur] = 1;
    try { localStorage.setItem("cgArena", JSON.stringify(A)); } catch (e) {}
    txt = "🎉 All tests passed! Problem marked as solved.\n\n" + txt;
  }
  $("res").textContent = txt;
}

function extra() {
  const p = P[cur];
  $("extra").innerHTML = (sh.h ? '<p class="mu">💡 ' + esc(p[3]) + '</p>' : "") +
    (sh.s ? '<pre>' + esc(TPL(ind(p[4]))) + '</pre>' : "");
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.f) { flt = d.f; list(); }
  else if (d.o !== undefined) open(+d.o);
  else if (d.b !== undefined) list();
  else if (d.run !== undefined) doRun();
  else if (d.sub !== undefined) doSub();
  else if (d.reset !== undefined) { try { localStorage.removeItem("cgCode" + cur); } catch (err) {} open(cur); }
  else if (d.h !== undefined) { sh.h = !sh.h; extra(); }
  else if (d.s !== undefined) { sh.s = !sh.s; extra(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "code") { try { localStorage.setItem("cgCode" + cur, e.target.value); } catch (err) {} }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "code" && e.key === "Tab") {
    e.preventDefault();
    e.target.setRangeText("  ", e.target.selectionStart, e.target.selectionEnd, "end");
    e.target.dispatchEvent(new Event("input", {bubbles: true}));
  }
});
list();
</script>
</body>
</html>
